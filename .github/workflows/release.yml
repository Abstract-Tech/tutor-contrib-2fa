name: Publish Python package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: python-package-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Abstract-Tech/tutor-contrib-2fa' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify tag matches package versions
        run: |
          python - <<'PYTHON'
          import os
          import runpy
          import tomllib
          from pathlib import Path

          version = runpy.run_path("tutor2fa/__about__.py")["__version__"]
          backend = tomllib.loads(Path("tutor2fa/backend/pyproject.toml").read_text())
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Release tag must match the plugin version")
          if backend["project"]["version"] != version:
              raise SystemExit("Bundled backend version must match the plugin version")
          PYTHON
      - name: Install development dependencies
        run: python -m pip install '.[dev]' ./tutor2fa/backend
      - name: Run tests
        run: make test
      - name: Build and validate distributions
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/tutor-contrib-2fa/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to TestPyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  test-install:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies from PyPI
        run: python -m pip install 'tutor>=22,<23' 'packaging>=23'
      - name: Install the release from TestPyPI
        shell: bash
        run: |
          version=$(python -c 'from tutor2fa.__about__ import __version__; print(__version__)')
          for attempt in 1 2 3 4 5; do
            if python -m pip install --no-cache-dir --no-deps --index-url https://test.pypi.org/simple/ "tutor-contrib-2fa==$version"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Verify installed plugin
        working-directory: ${{ runner.temp }}
        env:
          TUTOR_ROOT: ${{ runner.temp }}/tutor-test
          TUTOR_PLUGINS_ROOT: ${{ runner.temp }}/tutor-test/plugins
        run: |
          python -m pip check
          tutor plugins enable 2fa
          tutor config save
          tutor plugins list

  publish-pypi:
    name: Publish to PyPI
    needs: test-install
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tutor-contrib-2fa/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  prepare-existing-release:
    name: Verify tested 0.1.0 distributions
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Abstract-Tech/tutor-contrib-2fa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify the successful TestPyPI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import urllib.request

          url = "https://api.github.com/repos/Abstract-Tech/tutor-contrib-2fa/actions/runs/43866826685"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"]})
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)
          expected = {
              "conclusion": "success",
              "event": "push",
              "path": ".github/workflows/release.yml",
              "head_sha": "2fb9a454891972bbf34f7c95c9c3f30982b570f4",
          }
          for key, value in expected.items():
              if run[key] != value:
                  raise SystemExit(f"Unexpected source run {key}")
          PYTHON
      - name: Download original tested distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
          run-id: 43866826685
          github-token: ${{ github.token }}
      - name: Verify files match TestPyPI exactly
        run: |
          python - <<'PYTHON'
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          with urllib.request.urlopen("https://test.pypi.org/pypi/tutor-contrib-2fa/0.1.0/json", timeout=30) as response:
              release = json.load(response)
          expected = {item["filename"]: item["digests"]["sha256"] for item in release["urls"]}
          names = {"tutor_contrib_2fa-0.1.0-py3-none-any.whl", "tutor_contrib_2fa-0.1.0.tar.gz"}
          files = list(Path("dist").iterdir())
          if set(expected) != names or {file.name for file in files} != names:
              raise SystemExit("Expected exactly the 0.1.0 wheel and source distribution")
          for file in files:
              if hashlib.sha256(file.read_bytes()).hexdigest() != expected[file.name]:
                  raise SystemExit(f"TestPyPI hash mismatch: {file.name}")
          print("Both distributions match the tested TestPyPI release")
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: verified-0.1.0-distributions
          path: dist/
          if-no-files-found: error

  promote-existing-release:
    name: Publish tested 0.1.0 to PyPI
    needs: prepare-existing-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tutor-contrib-2fa/0.1.0/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-0.1.0-distributions
          path: dist/
      - name: Publish original distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
