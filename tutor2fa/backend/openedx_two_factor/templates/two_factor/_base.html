<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Two-factor authentication{% endblock %} · Open edX</title>
<style>
body{font:17px/1.6 system-ui,sans-serif;background:#f3f6fa;color:#182b49;margin:0}main{max-width:660px;margin:6vh auto;background:white;padding:36px;border-radius:16px;box-shadow:0 8px 30px #182b4912}h1{line-height:1.2}a{color:#125cc2}input{font:inherit;padding:8px;border:1px solid #8797aa;border-radius:5px;max-width:95%}button,.btn{display:inline-block;font:inherit;padding:9px 16px;background:#125cc2;color:white;border:0;border-radius:6px;cursor:pointer;text-decoration:none;margin:5px 0}label{display:block;font-weight:600}.errorlist{color:#ad1730}img{max-width:100%}nav{border-top:1px solid #dde3ed;margin-top:28px;padding-top:16px}.helptext{display:block;font-size:14px}
</style>{% block extra_media %}{% endblock %}</head>
<body><main><p>Open edX · Account security</p>{% block content_wrapper %}{% block content %}{% endblock %}{% endblock %}<nav><a href="/logout">Sign out</a></nav></main></body></html>
