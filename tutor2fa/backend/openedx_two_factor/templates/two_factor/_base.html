{% load i18n static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% trans "Two-factor authentication" %}{% endblock %} · Open edX</title>
    <link rel="stylesheet" href="{% static 'openedx_two_factor/two_factor.css' %}">
    {% block extra_media %}{% endblock %}
  </head>
  <body class="two-factor-page">
    <main class="two-factor-card">
      <p>Open edX · {% trans "Account security" %}</p>
      {% block content_wrapper %}
        {% block content %}{% endblock %}
      {% endblock %}
    </main>
  </body>
</html>
