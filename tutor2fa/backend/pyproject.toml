[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openedx-tutor-2fa"
version = "0.1.0"
description = "Open edX runtime integration bundled with tutor-contrib-2fa"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.11"
dependencies = ["django-two-factor-auth[phonenumberslite]", "requests>=2.31,<3"]

[project.entry-points."lms.djangoapp"]
openedx_two_factor = "openedx_two_factor.apps:OpenEdxTwoFactorConfig"

[project.entry-points."cms.djangoapp"]
openedx_two_factor = "openedx_two_factor.apps:OpenEdxTwoFactorConfig"

[tool.setuptools.packages.find]
include = ["openedx_two_factor*"]

[tool.setuptools.package-data]
openedx_two_factor = ["templates/**/*.html"]
